name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests & Verify Code Coverage (>80%)
        run: ./gradlew clean check jacocoTestReport --no-daemon

      - name: Build Boot WAR
        run: ./gradlew bootWar -x test --no-daemon

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/
          retention-days: 7

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbmt-server-war
          path: build/libs/*.war
          retention-days: 14

  docker-verify:
    name: Docker Build & Smoke Test
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env for Docker Compose
        run: cp .env.example .env

      - name: Build and Start Containers
        run: docker compose up -d --build

      - name: Wait for App to be Ready
        run: |
          echo "Waiting for app to start..."
          READY=false
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "App is healthy and OpenAPI docs are available!"
              READY=true
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 3
          done

          if [ "$READY" != "true" ]; then
            echo "App failed to start within timeout"
            docker compose logs
            exit 1
          fi

      - name: Verify API
        run: |
          # 1. OpenAPI documentation must be accessible (HTTP 200)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v3/api-docs)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Expected 200 for /v3/api-docs, got $HTTP_STATUS"
            exit 1
          fi
          echo "/v3/api-docs returned 200 OK"

          # 2. Register a new user
          REGISTER_RES=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"smokeuser","password":"Password123"}')
          HTTP_STATUS=$(echo "$REGISTER_RES" | tail -n1)
          BODY=$(echo "$REGISTER_RES" | sed '$d')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Expected 200 for /api/v1/auth/register, got $HTTP_STATUS. Response: $BODY"
            exit 1
          fi
          TOKEN=$(echo "$BODY" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to extract JWT token from register response"
            exit 1
          fi
          echo "User registered successfully, token acquired"

          # 3. Unauthorized access to protected endpoint must return 401
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/link/all)
          if [ "$HTTP_STATUS" != "401" ]; then
            echo "Expected 401 for unauthorized /api/v1/link/all, got $HTTP_STATUS"
            exit 1
          fi
          echo "Protected endpoint correctly returned 401 for unauthorized request"

          # 4. Create a short link with JWT authentication
          CREATE_RES=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/v1/link/create \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"originalUrl":"https://example.com","customCode":"smoke123"}')
          HTTP_STATUS=$(echo "$CREATE_RES" | tail -n1)
          BODY=$(echo "$CREATE_RES" | sed '$d')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Expected 200 for /api/v1/link/create, got $HTTP_STATUS. Response: $BODY"
            exit 1
          fi
          echo "Short link smoke123 created successfully"

          # 5. Short link redirection must return HTTP 302
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/link/go/smoke123)
          if [ "$HTTP_STATUS" != "302" ]; then
            echo "Expected 302 redirect for /api/v1/link/go/smoke123, got $HTTP_STATUS"
            exit 1
          fi
          echo "/api/v1/link/go/smoke123 correctly redirected (HTTP 302)"

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Teardown Containers
        if: always()
        run: docker compose down -v

  docker-publish:
    name: Publish to GitHub Container Registry (GHCR)
    needs: [test-and-build, docker-verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
